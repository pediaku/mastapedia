<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>
:root{--ac:#4f46e5;--ac2:#4338ca;--ink:#0f172a;--mu:#64748b;--ln:#e2e8f0;--bg:#f1f5f9;--sb:#0f172a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}
.side{position:fixed;inset:0 auto 0 0;width:248px;background:var(--sb);color:#cbd5e1;display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px;color:#fff;font-weight:700;font-size:16px;border-bottom:1px solid #1e293b}.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand img,.brand i{width:34px;height:34px;border-radius:9px;object-fit:contain;flex:none}.brand i{display:grid;place-items:center;font-style:normal;background:var(--ac)}
.menu{padding:10px 12px;flex:1;overflow:auto}.menu small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#64748b;padding:12px 10px 6px}
.menu button,.sf a,.sf button{width:100%;display:flex;align-items:center;gap:12px;background:none;color:#cbd5e1;padding:10px 12px;border-radius:9px;font-weight:600;margin-bottom:2px;text-align:left}
.menu button:hover,.sf a:hover,.sf button:hover{background:#1e293b}.menu button.on{background:var(--ac);color:#fff}
.side svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sf{padding:12px;border-top:1px solid #1e293b}
.wrap{margin-left:248px;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--ln);height:60px;display:flex;align-items:center;gap:12px;padding:0 24px}.top h1{font-size:18px;margin:0}
.burger{display:none;background:#f1f5f9;border-radius:9px;width:38px;height:38px;place-items:center}.burger svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2}.bk{display:none}
main{max-width:1100px;margin:0 auto;padding:24px}
@media(max-width:860px){.side{transform:translateX(-100%)}body.open .side{transform:none}body.open .bk{display:block;position:fixed;inset:0;background:#0f172a80;z-index:20}.wrap{margin-left:0}.burger{display:grid}.top{padding:0 16px}main{padding:16px}}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:20px;margin-bottom:20px}h2{margin:0 0 14px;font-size:16px}.card h2+.mu{margin:-8px 0 14px}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:14px 0 6px}.in{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px 12px;background:#fff;outline:0}.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px #4f46e51f}
.btn{background:var(--ac);color:#fff;font-weight:600;border-radius:9px;padding:10px 18px;margin-top:16px}.btn:hover{background:var(--ac2)}.btn.g{background:#f1f5f9;color:var(--ink)}.btn.g:hover{background:#e2e8f0}.btn.sm{padding:6px 12px;margin:0;font-size:12px}.btn.r{background:#fee2e2;color:#b91c1c}.btn:disabled{opacity:.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);text-align:left;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--ln);white-space:nowrap}td{padding:12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}tr:last-child td{border-bottom:0}
.st{display:inline-block;border-radius:99px;padding:3px 10px;font-weight:600;font-size:11px;white-space:nowrap}.pending{background:#fef3c7;color:#b45309}.done{background:#dcfce7;color:#15803d}.paid{background:#dbeafe;color:#1d4ed8}.expire{background:#fee2e2;color:#b91c1c}.off{background:#f1f5f9;color:#64748b}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}.stats .card{margin:0}.stats small{color:var(--mu);font-size:12px;font-weight:600}.stats b{display:block;font-size:24px;margin-top:6px}
.thumb{width:40px;height:40px;border-radius:9px;object-fit:contain;background:#f1f5f9}.msg{font-size:13px;margin-top:12px;color:#dc2626;min-height:16px}.msg.ok{color:#15803d}.mu{color:var(--mu)}code{font-size:12px;word-break:break-all}.acts{white-space:nowrap}
.login{max-width:380px;margin:14vh auto;padding:28px}.login .btn{width:100%}.hint{font-size:12px;color:var(--mu);margin:6px 0 0}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const dt=s=>s?new Date(s).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
async function api(p,b){const r=await fetch('/api/'+p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(r.status==401&&p!='admin/login')throw Object.assign(new Error('401'),{auth:1});if(!r.ok)throw new Error(j.error||'Gagal');return j}
const msg=(t,ok,id='m')=>{const m=$('#'+id);if(m){m.className='msg'+(ok?' ok':'');m.textContent=t}};
let D,tab='tx',edit=null,spid='';
const IC={tx:'<path d="M3 5h18M3 12h18M3 19h12"/>',pr:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',st:'<path d="M3 7h18v4H3zM5 11v9h14v-9M10 15h4"/>',vc:'<path d="M3 9a2 2 0 0 0 0 6v3h18v-3a2 2 0 0 1 0-6V6H3zM14 6v12"/>',cf:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};
const svg=k=>'<svg viewBox="0 0 24 24">'+IC[k]+'</svg>';
const TABS=[['tx','Transaksi','Penjualan'],['pr','Produk','Katalog'],['st','Stok','Katalog'],['vc','Voucher','Promosi'],['cf','Pengaturan','Sistem']];
function login(){
  $('#app').innerHTML='<div class="card login"><h2 style="font-size:20px">Masuk Admin</h2><p class="mu" style="margin:0 0 6px">Silakan login untuk mengelola toko.</p><label>Username</label><input class="in" id="u" autocapitalize="none"><label>Password</label><input class="in" id="p" type="password"><div id="m" class="msg"></div><button class="btn" id="go">Masuk</button></div>';
  const go=async()=>{try{await api('admin/login',{username:$('#u').value,password:$('#p').value});start()}catch(e){msg(e.message)}};
  $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key=='Enter')go()};
}
async function start(){
  try{D=await api('admin/data')}catch(e){return e.auth?login():alert(e.message)}
  const s=D.settings;document.title='Admin - '+s.name;
  let grp='',menu='';for(const t of TABS){if(t[2]!=grp){grp=t[2];menu+='<small>'+grp+'</small>'}menu+='<button data-t="'+t[0]+'" class="'+(t[0]==tab?'on':'')+'">'+svg(t[0])+t[1]+'</button>'}
  $('#app').innerHTML='<aside class="side"><div class="brand">'+(s.logo?'<img src="'+E(s.logo)+'" alt="">':'<i>'+E((s.name[0]||'T').toUpperCase())+'</i>')+'<span>'+E(s.name)+'</span></div><nav class="menu">'+menu+'</nav><div class="sf"><a href="/" target="_blank"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>Lihat toko</a><button id="lo"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Keluar</button></div></aside><div class="bk" id="bk"></div><div class="wrap"><div class="top"><button class="burger" id="bg"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><h1>'+TABS.find(t=>t[0]==tab)[1]+'</h1></div><main id="v"></main></div>';
  $('#lo').onclick=async()=>{await api('admin/logout',{});login()};
  $('#bg').onclick=()=>document.body.classList.add('open');$('#bk').onclick=()=>document.body.classList.remove('open');document.body.classList.remove('open');
  document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;edit=null;start()});
  ({tx,pr,st,vc,cf})[tab]();
}
const SL={pending:'Menunggu bayar',paid:'Perlu diproses',done:'Selesai',expire:'Kedaluwarsa'};
function tx(){
  const o=D.orders,done=o.filter(x=>x.status=='done');
  $('#v').innerHTML='<div class="stats"><div class="card"><small>Omzet (selesai)</small><b>'+rp(done.reduce((a,x)=>a+x.amount,0))+'</b></div><div class="card"><small>Transaksi selesai</small><b>'+done.length+'</b></div><div class="card"><small>Menunggu bayar</small><b>'+o.filter(x=>x.status=='pending').length+'</b></div><div class="card"><small>Perlu diproses</small><b>'+o.filter(x=>x.status=='paid').length+'</b></div></div><div class="card"><h2>Kelola Transaksi</h2><div class="tw"><table><tr><th>Invoice</th><th>Waktu</th><th>Produk</th><th>Total</th><th>WhatsApp</th><th>Status</th><th></th></tr>'+(o.map(x=>'<tr><td><code>'+x.id+'</code></td><td>'+dt(x.createdAt)+'</td><td>'+E(x.pname)+' x'+x.qty+'</td><td>'+rp(x.total)+'</td><td>'+E(x.wa)+'</td><td><span class="st '+x.status+'">'+SL[x.status]+'</span></td><td>'+(x.status=='pending'?'<button class="btn sm g" data-o="'+x.id+'" data-a="check">Cek bayar</button>':x.status=='paid'?'<button class="btn sm" data-o="'+x.id+'" data-a="redeliver">Kirim akun</button>':'')+'</td></tr>').join('')||'<tr><td colspan="7" class="mu">Belum ada transaksi.</td></tr>')+'</table></div></div>';
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('admin/order',{id:b.dataset.o,action:b.dataset.a});start()}catch(e){alert(e.message);b.disabled=false}});
}
const shrink=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,192/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/png'))};im.onerror=()=>no(new Error('File gambar tidak valid'));im.src=URL.createObjectURL(f)});
function pr(){
  const p=edit||{type:'akun',active:true,badge:''},cats=[...new Set(D.products.map(x=>x.category).filter(Boolean))];
  $('#v').innerHTML='<div class="card"><h2>'+(edit?'Edit produk':'Tambah produk')+'</h2><div class="g2"><div><label>Nama produk</label><input class="in" id="n" value="'+E(p.name||'')+'" placeholder="Alight Motion Pro 1 Tahun"></div><div><label>Harga (Rp)</label><input class="in" id="h" type="number" value="'+(p.price||'')+'"></div></div><label>Deskripsi</label><textarea class="in" id="d" rows="3">'+E(p.desc||'')+'</textarea><div class="g2"><div><label>Jenis stok</label><select class="in" id="t"><option value="akun" '+(p.type=='akun'?'selected':'')+'>Akun (email, password, pin, dll)</option><option value="link" '+(p.type=='link'?'selected':'')+'>Link saja</option></select></div><div><label>Kategori</label><input class="in" id="c" list="cl" value="'+E(p.category||'')+'" placeholder="Design & Edit"><datalist id="cl">'+cats.map(c=>'<option value="'+E(c)+'">').join('')+'</datalist></div></div><div class="g2"><div><label>Label</label><select class="in" id="b">'+['','HOT','AUTO','NEW'].map(x=>'<option value="'+x+'" '+(p.badge==x?'selected':'')+'>'+(x||'Tanpa label')+'</option>').join('')+'</select></div><div><label>Status</label><select class="in" id="a"><option value="1" '+(p.active!==false?'selected':'')+'>Tampil di toko</option><option value="0" '+(p.active===false?'selected':'')+'>Sembunyikan</option></select></div></div><label>Icon produk (upload gambar atau isi URL https)</label><div style="display:flex;gap:12px;align-items:center"><img class="thumb" id="pv" src="'+E(p.icon||'')+'" '+(p.icon?'':'style="visibility:hidden"')+'><input type="file" id="f" accept="image/png,image/jpeg,image/webp"></div><input class="in" id="i" style="margin-top:8px" value="'+(p.icon&&!p.icon.startsWith('data:')?E(p.icon):'')+'" placeholder="https://.../logo.png"><div id="m" class="msg"></div><button class="btn" id="sv">Simpan</button> '+(edit?'<button class="btn g" id="cn">Batal</button>':'')+'</div><div class="card"><h2>Daftar produk</h2><div class="tw"><table><tr><th></th><th>Produk</th><th>Harga</th><th>Stok</th><th>Status</th><th></th></tr>'+(D.products.map(x=>'<tr><td>'+(x.icon?'<img class="thumb" src="'+E(x.icon)+'">':'')+'</td><td><b>'+E(x.name)+'</b><br><span class="mu">'+E(x.category||'-')+' &middot; '+(x.type=='link'?'link':'akun')+'</span></td><td>'+rp(x.price)+'</td><td>'+x.stock+'</td><td>'+(x.active?'Tampil':'Tersembunyi')+'</td><td><button class="btn sm g" data-e="'+x.id+'">Edit</button> <button class="btn sm r" data-x="'+x.id+'">Hapus</button></td></tr>').join('')||'<tr><td colspan="6" class="mu">Belum ada produk.</td></tr>')+'</table></div></div>';
  let icon=p.icon||'';
  $('#f').onchange=async e=>{try{icon=await shrink(e.target.files[0]);$('#i').value='';$('#pv').src=icon;$('#pv').style.visibility='visible'}catch(x){msg(x.message)}};
  $('#sv').onclick=async()=>{try{await api('admin/product',{id:edit&&edit.id,name:$('#n').value,price:$('#h').value,desc:$('#d').value,type:$('#t').value,category:$('#c').value,badge:$('#b').value,active:$('#a').value=='1',icon:$('#i').value.trim()||icon});edit=null;start()}catch(e){msg(e.message)}};
  if($('#cn'))$('#cn').onclick=()=>{edit=null;pr()};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{edit=D.products.find(x=>x.id==b.dataset.e);pr();scrollTo(0,0)});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus produk ini? Stok yang belum terjual ikut tidak terpakai.')){await api('admin/product/delete',{id:b.dataset.x});start()}});
}
async function st(){
  if(!spid||!D.products.find(x=>x.id==spid))spid=(D.products[0]||{}).id||'';const p=D.products.find(x=>x.id==spid);
  if(!p)return $('#v').innerHTML='<div class="card">Tambahkan produk dulu di menu Produk.</div>';
  const items=await api('admin/stock?pid='+spid);
  $('#v').innerHTML='<div class="card"><h2>Stok produk</h2><label>Pilih produk</label><select class="in" id="sp">'+D.products.map(x=>'<option value="'+x.id+'" '+(x.id==spid?'selected':'')+'>'+E(x.name)+' (tersedia '+x.stock+')</option>').join('')+'</select><label>Tambah stok, satu baris per akun</label><textarea class="in" id="ln" rows="6" placeholder="'+(p.type=='link'?'https://link-satu\nhttps://link-dua':'email@gmail.com|password|pin|profile|a2f\nemail2@gmail.com|password2')+'"></textarea><p class="mu" style="font-size:12px;margin:6px 0 0">'+(p.type=='link'?'Produk jenis link: satu link per baris.':'Format: <code>email|password|pin|profile|a2f</code>. Pin, profile, dan a2f boleh dikosongkan atau dihilangkan.')+'</p><div id="m" class="msg"></div><button class="btn" id="ad">Tambah stok</button></div><div class="card"><h2>Isi stok (terbaru)</h2><div class="tw"><table><tr><th>Data</th><th>Status</th><th></th></tr>'+(items.map(x=>'<tr><td><code>'+E(x.data.link||[x.data.email,x.data.password,x.data.pin,x.data.profile,x.data.a2f].filter(Boolean).join(' | '))+'</code></td><td>'+(x.sold?'<span class="st done">Terjual '+E(x.order||'')+'</span>':'<span class="st paid">Tersedia</span>')+'</td><td>'+(x.sold?'':'<button class="btn sm r" data-s="'+x.id+'">Hapus</button>')+'</td></tr>').join('')||'<tr><td colspan="3" class="mu">Belum ada stok.</td></tr>')+'</table></div></div>';
  $('#sp').onchange=e=>{spid=e.target.value;st()};
  $('#ad').onclick=async()=>{try{const r=await api('admin/stock/add',{pid:spid,lines:$('#ln').value});D=await api('admin/data');await st();msg(r.added+' stok ditambahkan.',1)}catch(e){msg(e.message)}};
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{try{await api('admin/stock/delete',{id:b.dataset.s});D=await api('admin/data');st()}catch(e){alert(e.message)}});
}
function vc(){
  const v=edit||{type:'percent',active:true},T=x=>x.type=='percent'?x.value+'%':rp(x.value);
  $('#v').innerHTML='<div class="card"><h2>'+(edit?'Edit voucher':'Buat voucher')+'</h2><div class="g3"><div><label>Kode voucher</label><input class="in" id="vk" value="'+E(v.code||'')+'" placeholder="HEMAT10" style="text-transform:uppercase" '+(edit?'readonly':'')+'></div><div><label>Jenis diskon</label><select class="in" id="vt"><option value="percent" '+(v.type=='percent'?'selected':'')+'>Persen (%)</option><option value="fixed" '+(v.type=='fixed'?'selected':'')+'>Potongan tetap (Rp)</option></select></div><div><label>Nilai diskon</label><input class="in" id="vv" type="number" min="1" value="'+(v.value||'')+'" placeholder="10"></div></div><div class="g3"><div><label>Minimal belanja (Rp)</label><input class="in" id="vm2" type="number" min="0" value="'+(v.min||'')+'" placeholder="0 = tanpa minimal"></div><div><label>Maksimal potongan (Rp, khusus persen)</label><input class="in" id="vx" type="number" min="0" value="'+(v.max||'')+'" placeholder="0 = tanpa batas"></div><div><label>Kuota pemakaian</label><input class="in" id="vq" type="number" min="0" value="'+(v.quota||'')+'" placeholder="0 = tanpa batas"></div></div><div class="g2"><div><label>Berlaku sampai</label><input class="in" id="ve" type="date" value="'+E(v.expiry||'')+'"><div class="hint">Kosongkan jika tanpa batas waktu.</div></div><div><label>Status</label><select class="in" id="va"><option value="1" '+(v.active!==false?'selected':'')+'>Aktif</option><option value="0" '+(v.active===false?'selected':'')+'>Nonaktif</option></select></div></div><div id="m" class="msg"></div><button class="btn" id="sv">Simpan voucher</button> '+(edit?'<button class="btn g" id="cn">Batal</button>':'')+'</div><div class="card"><h2>Daftar voucher</h2><div class="tw"><table><tr><th>Kode</th><th>Diskon</th><th>Syarat</th><th>Terpakai</th><th>Berlaku</th><th>Status</th><th></th></tr>'+(D.vouchers.map(x=>{const ex=x.expiry&&Date.now()>new Date(x.expiry+'T23:59:59+07:00').getTime(),fl=x.quota&&x.used>=x.quota;return '<tr><td><b><code>'+E(x.code)+'</code></b></td><td>'+T(x)+(x.type=='percent'&&x.max?'<br><span class="mu">maks '+rp(x.max)+'</span>':'')+'</td><td>'+(x.min?'Min. '+rp(x.min):'<span class="mu">Tanpa minimal</span>')+'</td><td>'+x.used+(x.quota?' / '+x.quota:' <span class="mu">(tanpa batas)</span>')+'</td><td>'+(x.expiry?dt(x.expiry+'T00:00:00').split(',')[0]:'<span class="mu">Selamanya</span>')+'</td><td><span class="st '+(!x.active?'off':ex?'expire':fl?'expire':'done')+'">'+(!x.active?'Nonaktif':ex?'Kedaluwarsa':fl?'Kuota habis':'Aktif')+'</span></td><td class="acts"><button class="btn sm g" data-e="'+E(x.code)+'">Edit</button> <button class="btn sm r" data-x="'+E(x.code)+'">Hapus</button></td></tr>'}).join('')||'<tr><td colspan="7" class="mu">Belum ada voucher.</td></tr>')+'</table></div></div>';
  $('#sv').onclick=async()=>{try{await api('admin/voucher',{code:$('#vk').value,type:$('#vt').value,value:$('#vv').value,min:$('#vm2').value,max:$('#vx').value,quota:$('#vq').value,expiry:$('#ve').value,active:$('#va').value=='1'});edit=null;start()}catch(e){msg(e.message)}};
  if($('#cn'))$('#cn').onclick=()=>{edit=null;vc()};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{edit=D.vouchers.find(x=>x.code==b.dataset.e);vc();scrollTo(0,0)});
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(confirm('Hapus voucher '+b.dataset.x+'?')){await api('admin/voucher/delete',{code:b.dataset.x});start()}});
}
function cf(){
  const s=D.settings;let logo=s.logo||'';
  $('#v').innerHTML='<div class="card" style="max-width:640px"><h2>Pengaturan website</h2><p class="mu">Nama dan logo tampil di toko, di sidebar admin, dan sebagai ikon tab browser.</p><label>Nama website</label><input class="in" id="sn" maxlength="40" value="'+E(s.name)+'"><label>Logo</label><div style="display:flex;gap:14px;align-items:center"><img class="thumb" id="pv" style="width:64px;height:64px" src="'+E(logo)+'" '+(logo?'':'hidden')+'><input type="file" id="f" accept="image/png,image/jpeg,image/webp"></div><input class="in" id="li" style="margin-top:10px" value="'+(logo&&!logo.startsWith('data:')?E(logo):'')+'" placeholder="atau tempel URL https://.../logo.png"><div class="hint">Disarankan gambar persegi (PNG transparan). Ukuran otomatis diperkecil.</div><div id="m" class="msg"></div><button class="btn" id="sv">Simpan pengaturan</button> <button class="btn g" id="rm">Hapus logo</button></div>';
  $('#f').onchange=async e=>{try{logo=await shrink(e.target.files[0]);$('#li').value='';$('#pv').src=logo;$('#pv').hidden=false}catch(x){msg(x.message)}};
  $('#rm').onclick=()=>{logo='';$('#li').value='';$('#pv').hidden=true};
  $('#sv').onclick=async()=>{try{await api('admin/settings',{name:$('#sn').value,logo:$('#li').value.trim()||logo});await start();msg('Pengaturan tersimpan.',1)}catch(e){msg(e.message)}};
}
start();
</script></body></html>
